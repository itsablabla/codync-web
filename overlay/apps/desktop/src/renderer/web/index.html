<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Codync</title>
    <style>
      #gate { min-height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #e7e7ea; font-family: -apple-system, system-ui, sans-serif; }
      #gate form { display: grid; gap: 12px; width: 280px; }
      #gate h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
      #gate input, #gate button { padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3a40; background: #17171a; color: inherit; font-size: 14px; }
      #gate button { background: #e7e7ea; color: #0b0b0d; border: none; cursor: pointer; font-weight: 600; }
      #gate .err { color: #ff6b6b; font-size: 13px; min-height: 1em; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="gate" hidden>
      <form id="gate-form">
        <h1>Codync</h1>
        <input name="user" placeholder="Username" autocomplete="username" value="admin" />
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit">Sign in</button>
        <p class="err" id="gate-error"></p>
      </form>
    </div>
    <script type="module">
      // Login gate: the app bundle only loads once the proxy's capability key is in
      // localStorage (headers can't carry auth through some hosting gateways, so the key
      // travels as the `k` query parameter; see bridge.ts and proxy/server.mjs).
      const STORE_KEY = 'codync-proxy-key'
      const gate = document.getElementById('gate')
      const form = document.getElementById('gate-form')
      const error = document.getElementById('gate-error')

      let booted = false
      function boot() {
        if (booted) return
        booted = true
        gate.hidden = true
        import('./main.ts')
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        error.textContent = ''
        const body = new URLSearchParams(new FormData(form))
        try {
          const res = await fetch('/__codync_login', { method: 'POST', body })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Sign-in failed')
          localStorage.setItem(STORE_KEY, data.token)
          boot()
        } catch (err) {
          error.textContent = err.message || 'Sign-in failed'
        }
      })

      // A key that no longer works (password rotated) should send the user back to the gate.
      async function keyWorks(key) {
        try {
          const res = await fetch(`/api/hello?k=${encodeURIComponent(key)}`, { method: 'POST', body: '{}' })
          return res.status !== 401
        } catch {
          return true // unreachable host: let the app show its own error
        }
      }

      const saved = localStorage.getItem(STORE_KEY)
      if (saved && (await keyWorks(saved))) {
        boot()
      } else {
        localStorage.removeItem(STORE_KEY)
        gate.hidden = false
      }
    </script>
  </body>
</html>
